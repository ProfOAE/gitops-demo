apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-gitops
  labels:
    app: learning-gitops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learning-gitops
  template:
    metadata:
      labels:
        app: learning-gitops
    spec:
      containers:
      - name: learning-gitops
        image: nginx:1.25
        ports:
        - containerPort: 80
